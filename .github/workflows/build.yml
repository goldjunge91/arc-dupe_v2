name: Build SlotSwapTool EXE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput keyboard

      - name: Run Build Script
        run: |
          python duper/build.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotSwapTool-EXE
          path: duper/dist/SlotSwapTool.exe
          if-no-files-found: error

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: "Automatisch generierter Build der neuesten Version."
          draft: false
          prerelease: false
          files: duper/dist/SlotSwapTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
